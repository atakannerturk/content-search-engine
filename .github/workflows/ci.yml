name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: content_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d content_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/content_test?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The assignment asks not to mention the issuing company anywhere. The
      # pattern is assembled from fragments so this file does not trip itself.
      - name: Forbidden names
        run: |
          pattern="enuy""gun|win""gie"
          if git grep -niE "$pattern" -- . ':!.github/workflows/ci.yml' ':!Makefile'; then
            echo "forbidden name found in the tree"; exit 1
          fi
          if git log -p --all -- . ':!.github/workflows/ci.yml' ':!Makefile' | grep -iE "$pattern"; then
            echo "forbidden name found in the history"; exit 1
          fi

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Tests (unit + integration)
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          repo-checkout: false

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t content-search-engine:ci .
